name: Deploy Kaam Card to GCP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to GCP Keylessly
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/530478294982/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-deployer@kaam-card-503914.iam.gserviceaccount.com'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Sync to Bucket
      run: |
        gcloud storage rsync -r . gs://${{ secrets.GCP_BUCKET_NAME }} \
          --exclude="^\.git/.*" \
          --exclude="^\.github/.*" \
          --exclude="COMPONENTS/.*" \
          --exclude="scripts/.*" \
          --delete-unmatched-destination-objects